      hash: md5
      md5: 8f82d6cee7b3649f2dfe02f35ca5af5f
      size: 979
    params:
      params.yaml:
        fetch.hidro_url: https://www.arso.gov.si/xml/vode/hidro_podatki_zadnji.xml
    outs:
