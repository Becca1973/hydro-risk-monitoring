schema: '2.0'
stages:
  fetch_hidro:
    cmd: "poetry run python src/data/fetch_hidro_data.py\ngit commit -am \"Updated
      raw hidro data on `date` with DVC pipeline and GitHub workflows\" || exit 0\n
      git push || true\ndvc push || true\n"
    deps:
    - path: src/data/fetch_hidro_data.py
      hash: md5
      md5: 8f82d6cee7b3649f2dfe02f35ca5af5f
      size: 979
    params:
      params.yaml:
        fetch.hidro_url: https://www.arso.gov.si/xml/vode/hidro_podatki_zadnji.xml
    outs:
    - path: data/raw/hidro/hidro_data.xml
      hash: md5
      md5: b175fea83c7f7e4477f9f3162b61f46a
      size: 97673
