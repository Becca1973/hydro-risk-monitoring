stages:
  fetch_hidro:
    cmd: |
      poetry run python src/data/fetch_hidro_data.py
      git commit -am "Updated raw hidro data on `date` with DVC pipeline and GitHub workflows" || exit 0
      git push || true
      dvc push || true
    deps:
      - src/data/fetch_hidro_data.py
    params:
      - fetch.hidro_url
    outs:
      - data/raw/hidro/hidro_data.xml
    always_changed: true

  preprocess_hidro:
    cmd: |
      poetry run python src/data/preprocess_hidro_data.py
      git commit -am "Updated preprocessed hidro data on `date` with DVC pipeline and GitHub workflows" || exit 0
      git push || true
      dvc push || true
    deps:
      - src/data/preprocess_hidro_data.py
      - data/raw/hidro/hidro_data.xml
    params:
      - stations.hidro_stations
    outs:
      - data/preprocessed/hidro:
          persist: true

  fetch_weather:
    cmd: |
      poetry run python src/data/fetch_weather_data.py
      git commit -am "Updated raw weather data on `date` with DVC pipeline and GitHub workflows" || true
      git push || true
      dvc push || true
    deps:
      - src/data/fetch_weather_data.py
    params:
      - fetch.weather_url
    outs:
      - data/raw/weather/weather_data.xml
    always_changed: true

  preprocess_weather:
    cmd: |
      poetry run python src/data/preprocess_weather_data.py
      git commit -am "Updated preprocessed weather data on `date` with DVC pipeline and GitHub workflows" || true
      git push || true
      dvc push || true
    deps:
      - src/data/preprocess_weather_data.py
      - data/raw/weather/weather_data.xml
    params:
      - stations.weather_stations
    outs:
      - data/preprocessed/weather:
          persist: true

  validate_data:
    cmd: poetry run python gx/run_checkpoint.py
    deps:
      - data/preprocessed/hidro
      - data/preprocessed/weather
      - gx/run_checkpoint.py
      - gx/expectations/hidro_suite.json
      - gx/expectations/weather_suite.json
      - gx/great_expectations.yml
    outs:
      - gx/uncommitted/data_docs:
          persist: true

  test_data:
    cmd: poetry run python src/data/test_data.py
    deps:
      - data/preprocessed/hidro
      - data/preprocessed/weather
      - src/data/test_data.py
    outs:
      - data/reference/hidro:
          persist: true
      - data/reference/weather:
          persist: true
      - reports/data_testing:
          persist: true

  train_hidro:
    cmd: |
      poetry run python -m src.model.train_hidro
      git commit -am "Updated hidro models on `date` with DVC pipeline and GitHub workflows" || true
      git push || true
      dvc push || true
    deps:
      - src/model/preprocess.py
      - src/model/train_hidro.py
      - data/preprocessed/hidro
      - gx/uncommitted/data_docs
      - data/reference/hidro
    params:
      - train.hidro_input_dir
      - train.models_output_dir
      - train.target_col
      - train.feature_cols
      - train.window_size
      - train.test_size
      - train.epochs
      - train.batch_size
      - train.min_rows
    outs:
      - models/hidro:
          persist: true
      - reports/modeling:
          persist: true
