[tool.poetry]
name = "hydro-risk-monitoring"
version = "0.1.0"
description = "Sistem za spremljanje in napovedovanje hidroloških tveganj"
authors = ["rebekacep <rebeka.cep@student.um.si>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = "1.26.4"
pandas = "^2.2.3"
scikit-learn = "^1.6.1"
lxml = "^5.3.2"
requests = "^2.32.3"
dvc = {extras = ["s3"], version = "^3.59.1"}
pyyaml = "^6.0.2"
jupyterlab-widgets = "3.0.15"
great-expectations = "0.18.21"
evidently = ">=0.7.1,<0.8.0"
tensorflow-io-gcs-filesystem = "0.31.0"
tensorflow = "2.19.0"
mlflow = "^3.13.0"
tf2onnx = "^1.17.0"
onnx = "^1.21.0"
onnxruntime = "^1.26.0"
fastapi = "^0.136.3"
uvicorn = "^0.49.0"
streamlit = "^1.58.0"
folium = "^0.20.0"
streamlit-folium = "^0.27.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
