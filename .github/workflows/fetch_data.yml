name: Fetch data on schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  fetch_hidro:
    name: Fetch and pre-process hidro data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: poetry

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: DVC pull data
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc pull

      - name: Run fetch script
        run: |
          poetry run python src/data/fetch_hidro_data.py

      - name: Run pre-process script
        run: |
          poetry run python src/data/preprocess_hidro_data.py

      - name: Commit data changes
        run: |
          dvc add data
          dvc push
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data.dvc
          git commit -m "Updated raw hidro data on `date` with GitHub Actions" || echo "No changes to commit"

      - name: Pull latest changes
        run: |
          git pull --rebase origin main || echo "Nothing to rebase or already up to date"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}

  fetch_weather:
    name: Fetch and pre-process weather data
    needs: fetch_hidro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: poetry

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: DVC pull data
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc pull

      - name: Run fetch script
        run: |
          poetry run python src/data/fetch_weather_data.py

      - name: Run pre-process script
        run: |
          poetry run python src/data/preprocess_weather_data.py

      - name: Commit data changes
        run: |
          dvc add data
          dvc push
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data.dvc
          git commit -m "Updated raw hidro data on `date` with GitHub Actions" || echo "No changes to commit"

      - name: Pull latest changes
        run: |
          git pull --rebase origin main || echo "Nothing to rebase or already up to date"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
